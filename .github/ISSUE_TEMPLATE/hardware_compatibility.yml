name: Hardware / compatibility report
description: Share how Verse-atile behaves on your hardware and Unreal version.
title: "[HARDWARE] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Share only general hardware information. Do not post serial numbers, device IDs, IP addresses, usernames, private paths, credentials, or private project content.
  - type: dropdown
    id: engine
    attributes:
      label: Unreal Engine version
      options:
        - UE 5.2
        - UE 5.7
        - UE 5.8
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU model
      placeholder: Example: Intel Core i7-12700K
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU model and VRAM
      placeholder: Example: RTX 3070 Ti, 8 GB
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: System RAM
      placeholder: Example: 32 GB
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Main project storage type
      options:
        - NVMe SSD
        - SATA SSD
        - HDD
        - External SSD
        - Other / mixed
        - Not sure
  - type: textarea
    id: workload
    attributes:
      label: What did you test?
      description: Describe the Verse-atile feature, map/workload, resolution, and important settings.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result / performance
      description: FPS, frame-time observations, memory/VRAM behavior, generation speed, loading/streaming behavior, or stability notes.
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Problems or limits you noticed
  - type: checkboxes
    id: privacy
    attributes:
      label: Public submission check
      options:
        - label: I have not included serial numbers, IDs, IP addresses, private paths, credentials, or private project data.
          required: true
