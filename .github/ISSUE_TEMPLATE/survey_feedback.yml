name: Survey / general feedback
description: Tell us what is working, what is confusing, and what Verse-atile should improve.
title: "[FEEDBACK] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This is a public form. Please do not include private source code, credentials, private project files, account data, serial numbers, IP addresses, or confidential information.
  - type: dropdown
    id: experience
    attributes:
      label: Unreal experience level
      options:
        - New / beginner
        - Learning / intermediate
        - Advanced
        - Professional / studio
        - Prefer not to say
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Unreal Engine version you care about most
      options:
        - UE 5.2
        - UE 5.7
        - UE 5.8
        - More than one
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: satisfaction
    attributes:
      label: How useful does Verse-atile look for your workflow?
      options:
        - 5 - Extremely useful
        - 4 - Very useful
        - 3 - Useful
        - 2 - Somewhat useful
        - 1 - Not useful yet
    validations:
      required: true
  - type: checkboxes
    id: interests
    attributes:
      label: What are you most interested in?
      options:
        - label: Beginner Mode / guided presets
        - label: Blueprint / C++ / Verse / Visual Nodes
        - label: AI / Versa / Autopilot
        - label: Animation / Motion Studio / Motion Matching
        - label: Weather / metabolism / survival
        - label: Worlds / streaming / Continuum
        - label: MetaHuman / Mutable character tools
        - label: Weapons / vehicles / gameplay systems
        - label: Optimization / hardware profiling
        - label: Security / Guardian
        - label: Storage / cloud / backups
        - label: Documentation / community tools
  - type: textarea
    id: best
    attributes:
      label: What should we keep or prioritize?
  - type: textarea
    id: improve
    attributes:
      label: What should we improve?
      description: Confusing workflows, missing docs, desired presets, accessibility needs, or ideas are welcome.
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: What would you like to see in a future update?
  - type: checkboxes
    id: privacy
    attributes:
      label: Public submission check
      options:
        - label: I understand this submission is public and I have not included private or sensitive information.
          required: true
